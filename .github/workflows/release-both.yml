name: Release (26.2 + 26.3 together)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release on both lines (e.g. 3.3.0) -- becomes mod_version in gradle.properties on both branches'
        required: true
      line_branch:
        description: 'Branch holding the 26.3 line'
        required: false
        default: 'claude/port-26-3-v2'
      tag_suffix:
        description: 'Suffix appended only to the 26.3 line''s git tag/Modrinth version (e.g. "-26.3"), never to mod_version'
        required: false
        default: '-26.3'
      changelog:
        description: 'Changelog for this version (used for both Modrinth uploads and the combined GitHub release)'
        required: false
        default: 'See the GitHub release for details.'

# Cuts a version on the 26.2 (this branch) and 26.3 (inputs.line_branch) lines
# in one dispatch, then publishes ONE GitHub release page carrying both jars --
# replacing the by-hand consolidation (delete the 26.3 line's auto-created
# release, re-attach its jar to the 26.2 release) that used to follow every
# paired release. Each line still gets its own git tag and its own Modrinth
# version; only the GitHub Releases-page listing is combined.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # One "prepare" per line: bump mod_version, commit, tag, and push straight
  # to that line's branch. Mirrors release.yml's own prepare job on each line
  # (26.3's already skips the commit when mod_version is unchanged).
  prepare-26-2:
    runs-on: ubuntu-22.04
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.ref_name }}
        fetch-depth: 0
    - name: Bump version, tag, and push (26.2)
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        sed -i "s/^mod_version=.*/mod_version=${{ inputs.version }}/" gradle.properties
        git add gradle.properties
        git diff --cached --quiet || git commit -m "Release v${{ inputs.version }}"
        git tag "v${{ inputs.version }}"
        git push origin HEAD:${{ github.ref_name }} "v${{ inputs.version }}"
    - name: Resolve ref/version for later jobs
      id: resolve
      run: |
        echo "ref=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
        echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

  prepare-26-3:
    runs-on: ubuntu-22.04
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.line_branch }}
        fetch-depth: 0
    - name: Bump version, tag, and push (26.3)
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        sed -i "s/^mod_version=.*/mod_version=${{ inputs.version }}/" gradle.properties
        git add gradle.properties
        git diff --cached --quiet || git commit -m "Release v${{ inputs.version }}${{ inputs.tag_suffix }}"
        git tag "v${{ inputs.version }}${{ inputs.tag_suffix }}"
        git push origin HEAD:${{ inputs.line_branch }} "v${{ inputs.version }}${{ inputs.tag_suffix }}"
    - name: Resolve ref/version for later jobs
      id: resolve
      run: |
        echo "ref=v${{ inputs.version }}${{ inputs.tag_suffix }}" >> "$GITHUB_OUTPUT"
        echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

  compile-native-libs-26-2:
    needs: prepare-26-2
    strategy:
      matrix:
        platform:
          - name: linux-gnu-x86_64
            runs-on: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-gnu-arm64
            runs-on: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ needs.prepare-26-2.outputs.ref }}
    - name: Install dependencies
      run: sudo apt install -y libxkbcommon-dev nasm libclang-dev
    - name: Build static x264
      run: |
        git clone --depth 1 --branch stable https://code.videolan.org/videolan/x264.git /tmp/x264
        cd /tmp/x264
        ./configure --prefix=/tmp/x264-install --enable-static --enable-pic --disable-cli
        make -j$(nproc)
        make install
    - name: Setup rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Compile native library
      working-directory: native/
      env:
        PKG_CONFIG_PATH: /tmp/x264-install/lib/pkgconfig
        SYSTEM_DEPS_X264_LINK: static
      run: cargo build --release --target=${{ matrix.platform.target }}
    - name: Move native library
      run: |
        mkdir native-libs
        mv native/target/${{ matrix.platform.target }}/release/libwaylandcraft.so \
          native-libs/libwaylandcraft-${{ matrix.platform.name }}.so
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: native-libs-26-2-${{ matrix.platform.name }}
        path: native-libs/libwaylandcraft-${{ matrix.platform.name }}.so

  # The Windows backend (native/src/win32) is cross-compiled with mingw; it needs
  # neither xkbcommon nor x264
  compile-native-windows-26-2:
    needs: prepare-26-2
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ needs.prepare-26-2.outputs.ref }}
    - name: Install dependencies
      run: sudo apt install -y gcc-mingw-w64-x86-64
    - name: Setup rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-gnu
    - name: Compile native library
      working-directory: native/
      run: cargo build --release --target=x86_64-pc-windows-gnu
    - name: Move native library
      run: |
        mkdir native-libs
        mv native/target/x86_64-pc-windows-gnu/release/waylandcraft.dll \
          native-libs/waylandcraft-windows-x86_64.dll
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: native-libs-26-2-windows-x86_64
        path: native-libs/waylandcraft-windows-x86_64.dll

  compile-native-libs-26-3:
    needs: prepare-26-3
    strategy:
      matrix:
        platform:
          - name: linux-gnu-x86_64
            runs-on: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-gnu-arm64
            runs-on: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ needs.prepare-26-3.outputs.ref }}
    - name: Install dependencies
      run: sudo apt install -y libxkbcommon-dev nasm libclang-dev
    - name: Build static x264
      run: |
        git clone --depth 1 --branch stable https://code.videolan.org/videolan/x264.git /tmp/x264
        cd /tmp/x264
        ./configure --prefix=/tmp/x264-install --enable-static --enable-pic --disable-cli
        make -j$(nproc)
        make install
    - name: Setup rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Compile native library
      working-directory: native/
      env:
        PKG_CONFIG_PATH: /tmp/x264-install/lib/pkgconfig
        SYSTEM_DEPS_X264_LINK: static
      run: cargo build --release --target=${{ matrix.platform.target }}
    - name: Move native library
      run: |
        mkdir native-libs
        mv native/target/${{ matrix.platform.target }}/release/libwaylandcraft.so \
          native-libs/libwaylandcraft-${{ matrix.platform.name }}.so
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: native-libs-26-3-${{ matrix.platform.name }}
        path: native-libs/libwaylandcraft-${{ matrix.platform.name }}.so

  # The Windows backend (native/src/win32) is cross-compiled with mingw; it needs
  # neither xkbcommon nor x264
  compile-native-windows-26-3:
    needs: prepare-26-3
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ needs.prepare-26-3.outputs.ref }}
    - name: Install dependencies
      run: sudo apt install -y gcc-mingw-w64-x86-64
    - name: Setup rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-gnu
    - name: Compile native library
      working-directory: native/
      run: cargo build --release --target=x86_64-pc-windows-gnu
    - name: Move native library
      run: |
        mkdir native-libs
        mv native/target/x86_64-pc-windows-gnu/release/waylandcraft.dll \
          native-libs/waylandcraft-windows-x86_64.dll
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: native-libs-26-3-windows-x86_64
        path: native-libs/waylandcraft-windows-x86_64.dll

  # Builds and publishes to Modrinth per-line (each line's gradle.properties
  # carries its own minecraft_version, so Minotaur tags the upload with the
  # right game version automatically). The jar is also kept as a build
  # artifact so the release job below can attach both jars to one page.
  build-26-2:
    runs-on: ubuntu-22.04
    needs: [prepare-26-2, compile-native-libs-26-2, compile-native-windows-26-2]
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ needs.prepare-26-2.outputs.ref }}
    - name: Download native libs
      uses: actions/download-artifact@v8
      with:
        path: native-libs
        pattern: native-libs-26-2-*
        merge-multiple: true
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Setup gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Build java code
      run: ./gradlew build
    - name: Attest build provenance
      uses: actions/attest-build-provenance@v3
      with:
        subject-path: build/libs/waylandcraft_plus_plus.jar
    - name: Publish to Modrinth
      env:
        MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
        MODRINTH_CHANGELOG: ${{ inputs.changelog }}
      run: ./gradlew modrinth
    # No-op until CURSEFORGE_TOKEN/CURSEFORGE_PROJECT_ID are set (see build.gradle).
    - name: Publish to CurseForge
      env:
        CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
        CURSEFORGE_CHANGELOG: ${{ inputs.changelog }}
      run: ./gradlew publishCurseForge
    - name: Upload jar for combined release
      uses: actions/upload-artifact@v7
      with:
        name: jar-26-2
        path: build/libs/waylandcraft_plus_plus.jar

  build-26-3:
    runs-on: ubuntu-22.04
    needs: [prepare-26-3, compile-native-libs-26-3, compile-native-windows-26-3]
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ needs.prepare-26-3.outputs.ref }}
    - name: Download native libs
      uses: actions/download-artifact@v8
      with:
        path: native-libs
        pattern: native-libs-26-3-*
        merge-multiple: true
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Setup gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Build java code
      run: ./gradlew build
    - name: Attest build provenance
      uses: actions/attest-build-provenance@v3
      with:
        subject-path: build/libs/waylandcraft_plus_plus.jar
    - name: Publish to Modrinth
      env:
        MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
        MODRINTH_CHANGELOG: ${{ inputs.changelog }}
      run: ./gradlew modrinth
    # No-op until CURSEFORGE_TOKEN/CURSEFORGE_PROJECT_ID are set (see build.gradle).
    - name: Publish to CurseForge
      env:
        CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
        CURSEFORGE_CHANGELOG: ${{ inputs.changelog }}
      run: ./gradlew publishCurseForge
    - name: Upload jar for combined release
      uses: actions/upload-artifact@v7
      with:
        name: jar-26-3
        path: build/libs/waylandcraft_plus_plus.jar

  # Combines both lines' jars onto a single GitHub release page, tagged with
  # the 26.2 line's tag -- this is the by-hand consolidation step Artemis
  # used to do after every paired release, now done here instead.
  release:
    runs-on: ubuntu-22.04
    needs: [prepare-26-2, prepare-26-3, build-26-2, build-26-3]
    steps:
    - name: Download 26.2 jar
      uses: actions/download-artifact@v8
      with:
        name: jar-26-2
        path: dist
    - name: Download 26.3 jar
      uses: actions/download-artifact@v8
      with:
        name: jar-26-3
        path: dist-26-3
    - name: Rename 26.3 jar
      run: mv dist-26-3/waylandcraft_plus_plus.jar dist/waylandcraft_plus_plus-26.3.jar
    - name: Create combined GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.prepare-26-2.outputs.ref }}
        name: v${{ inputs.version }}
        body: |
          ${{ inputs.changelog }}

          Includes both release lines:
          - 26.2: `${{ needs.prepare-26-2.outputs.ref }}` -- `waylandcraft_plus_plus.jar`
          - 26.3: `${{ needs.prepare-26-3.outputs.ref }}` -- `waylandcraft_plus_plus-26.3.jar`
        files: |
          dist/waylandcraft_plus_plus.jar
          dist/waylandcraft_plus_plus-26.3.jar
        generate_release_notes: true
