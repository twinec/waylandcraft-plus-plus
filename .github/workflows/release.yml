name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 3.1) -- becomes tag vX.Y and the mod_version in gradle.properties'
        required: true
      changelog:
        description: 'Changelog for this version (optional)'
        required: false
        default: 'See the GitHub release for details.'

# Everything here runs from the exact tagged commit -- the jar published
# to Modrinth, attached to the GitHub Release, and covered by the
# provenance attestation below are always the one artifact this workflow
# builds, never something assembled locally and uploaded by hand.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # Only runs for a manual (workflow_dispatch) release: bumps
  # gradle.properties, commits, tags, and pushes -- so clicking "Run
  # workflow" in the Actions tab is enough to cut a release, with no git
  # access needed locally. A tag pushed this way still lands as a normal,
  # public, immutable git tag; every later job builds from that exact
  # commit, same as if the tag had been pushed by hand.
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      changelog: ${{ steps.resolve.outputs.changelog }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Bump version, tag, and push
      if: github.event_name == 'workflow_dispatch'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        sed -i "s/^mod_version=.*/mod_version=${{ inputs.version }}/" gradle.properties
        git commit -am "Release v${{ inputs.version }}"
        git tag "v${{ inputs.version }}"
        git push origin HEAD:${{ github.ref_name }} "v${{ inputs.version }}"
    - name: Resolve version/ref/changelog for later jobs
      id: resolve
      run: |
        # Commit messages/changelog text can be multi-line, which breaks the
        # plain "key=value" GITHUB_OUTPUT format -- the heredoc form with a
        # random delimiter is required so embedded newlines don't corrupt it.
        delim="EOF_$(uuidgen)"
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "ref=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          {
            echo "changelog<<$delim"
            echo "${{ inputs.changelog }}"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
        else
          echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          {
            echo "changelog<<$delim"
            echo "${{ github.event.head_commit.message }}"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
        fi

  compile-native-libs:
    needs: prepare
    strategy:
      matrix:
        platform:
          - name: linux-gnu-x86_64
            runs-on: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-gnu-arm64
            runs-on: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ needs.prepare.outputs.ref }}
    - name: Install dependencies
      run: sudo apt install -y libxkbcommon-dev
    - name: Setup rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Compile native library
      working-directory: native/
      run: cargo build --release --target=${{ matrix.platform.target }}
    - name: Move native library
      run: |
        mkdir native-libs
        mv native/target/${{ matrix.platform.target }}/release/libwaylandcraft.so \
          native-libs/libwaylandcraft-${{ matrix.platform.name }}.so
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: native-libs-${{ matrix.platform.name }}
        path: native-libs/libwaylandcraft-${{ matrix.platform.name }}.so

  build-and-release:
    runs-on: ubuntu-22.04
    needs: [prepare, compile-native-libs]
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ needs.prepare.outputs.ref }}
    - name: Download native libs
      uses: actions/download-artifact@v8
      with:
        path: native-libs
        pattern: native-libs-*
        merge-multiple: true
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Setup gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Build java code
      run: ./gradlew build

    # Publicly, verifiably ties this exact jar to this exact commit/workflow
    # run via Sigstore -- checkable with `gh attestation verify <jar> -R <repo>`.
    - name: Attest build provenance
      uses: actions/attest-build-provenance@v3
      with:
        subject-path: build/libs/waylandcraft.jar

    - name: Publish to Modrinth
      env:
        MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
        MODRINTH_CHANGELOG: ${{ needs.prepare.outputs.changelog }}
      run: ./gradlew modrinth

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.prepare.outputs.ref }}
        files: build/libs/waylandcraft.jar
        generate_release_notes: true
