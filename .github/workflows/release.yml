name: Release
on:
  push:
    tags:
      - 'v*'

# Everything here runs from the exact tagged commit -- the jar published
# to Modrinth, attached to the GitHub Release, and covered by the
# provenance attestation below are always the one artifact this workflow
# builds, never something assembled locally and uploaded by hand.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  compile-native-libs:
    strategy:
      matrix:
        platform:
          - name: linux-gnu-x86_64
            runs-on: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-gnu-arm64
            runs-on: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
    - uses: actions/checkout@v6
    - name: Install dependencies
      run: sudo apt install -y libxkbcommon-dev
    - name: Setup rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Compile native library
      working-directory: native/
      run: cargo build --release --target=${{ matrix.platform.target }}
    - name: Move native library
      run: |
        mkdir native-libs
        mv native/target/${{ matrix.platform.target }}/release/libwaylandcraft.so \
          native-libs/libwaylandcraft-${{ matrix.platform.name }}.so
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: native-libs-${{ matrix.platform.name }}
        path: native-libs/libwaylandcraft-${{ matrix.platform.name }}.so

  build-and-release:
    runs-on: ubuntu-22.04
    needs: compile-native-libs
    steps:
    - uses: actions/checkout@v6
    - name: Download native libs
      uses: actions/download-artifact@v8
      with:
        path: native-libs
        pattern: native-libs-*
        merge-multiple: true
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Setup gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Build java code
      run: ./gradlew build

    # Publicly, verifiably ties this exact jar to this exact commit/workflow
    # run via Sigstore -- checkable with `gh attestation verify <jar> -R <repo>`.
    - name: Attest build provenance
      uses: actions/attest-build-provenance@v3
      with:
        subject-path: build/libs/waylandcraft.jar

    - name: Publish to Modrinth
      env:
        MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
        MODRINTH_CHANGELOG: ${{ github.event.head_commit.message }}
      run: ./gradlew modrinth

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        files: build/libs/waylandcraft.jar
        generate_release_notes: true
