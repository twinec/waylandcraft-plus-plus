[package]
name = "waylandcraft"
version = "0.1.0"
edition = "2024"

[lib]
name = "waylandcraft"
crate-type = [ "cdylib" ]

[dependencies]
jni = "0.22.4"
thiserror = "2.0"
cfg-if = "1.0"

# The Wayland compositor backend (Linux)
[target.'cfg(target_os = "linux")'.dependencies]
smithay = { git = "https://github.com/Smithay/smithay.git", rev = "89e58f7", default-features = false, features = [ "wayland_frontend", "backend_drm" ] }
libc = { version = "0.2.176", default-features = false }
xkbcommon = "0.8.0"
cosmic-freedesktop-icons = { git = "https://github.com/pop-os/freedesktop-icons.git", rev = "7a61a70" }
freedesktop-desktop-entry = "0.8.1"
resvg = { version = "0.47.0", default-features = false, features = [ "text", "memmap-fonts" ] }
shlex = "1.3.0"
# H.264 encoding for window sharing. Links the system libx264 by default; release builds
# link a static, PIC libx264 instead (SYSTEM_DEPS_X264_LINK=static, see TODO-SHARING.md).
x264-sys = "0.2.3"
rustix = { version = "1.1.3", features = [ "fs", "process" ] }

# The window capture backend (Windows)
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Metadata",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Security_Authorization_AppCapabilityAccess",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# Symbol names aren't needed for our own crash diagnosis -- Rust panic
# messages reach us as plain strings through the JNI bridge (Java's own
# exception message), not via a native backtrace, so this doesn't cost us
# anything there.
strip = "symbols"
