pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// Standalone Paper plugin providing server-side support for window items
// on Paper servers, which can't load the Fabric mod at all. Deliberately
// a separate module, not part of the root Fabric project -- see
// paper-plugin/build.gradle.
include 'paper-plugin'