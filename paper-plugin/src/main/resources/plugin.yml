name: WaylandCraftPaper
version: ${version}
main: dev.evvie.waylandcraft.paper.WaylandCraftPaperPlugin
# NOTE: verify this matches a Paper-supported api-version string for the
# target Minecraft version at build/release time -- Paper validates this
# against its own known-version list, it isn't free-form.
api-version: '1.21'
description: >
  Server-side support for WaylandCraft++ window items on Paper servers
  (no Fabric required). Companion to the WaylandCraft++ Fabric client mod --
  see https://github.com/twinec/waylandcraft-plus-plus
authors: [twinec, claude]
website: https://github.com/twinec/waylandcraft-plus-plus
