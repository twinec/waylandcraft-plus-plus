plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.modrinth.minotaur' version '2.+'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}

	// Polymer's own repo -- publishes each submodule (e.g. polymer-core)
	// unbundled. Modrinth's maven only exposes the combined jar-in-jar
	// "polymer-bundled" artifact, whose classes aren't visible at compile
	// time since Fabric Loader only unpacks jar-in-jar contents at runtime.
	exclusiveContent {
		forRepository {
			maven {
				name = "Nucleoid"
				url = "https://maven.nucleoid.xyz/"
			}
		}
		filter {
			includeGroup "eu.pb4"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	compileOnly "maven.modrinth:iris:${project.iris_version}"

	// Window sharing: pure-Java H.264 (JCodec) and Opus (Concentus), bundled in the jar
	// so every client can decode shared windows
	implementation include("org.jcodec:jcodec:${project.jcodec_version}")
	implementation include("io.github.jaredmdobson:concentus:${project.concentus_version}")
	compileOnly "eu.pb4:polymer-core:${project.polymer_version}"
	compileOnly "eu.pb4:polymer-resource-pack:${project.polymer_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

import org.gradle.internal.logging.text.StyledTextOutputFactory;
import static org.gradle.internal.logging.text.StyledTextOutput.Style;

jar {
	inputs.property "archivesName", project.base.archivesName
	version = null

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}

	// Human readable list of compiled native libraries that were found
	def natives = []

	// Host-specific native library
	def nativeFile = file("native/target/debug/libwaylandcraft.so")
	if(nativeFile.exists()) {
		from(nativeFile)
		natives.add("host")
	}

	// Packaging of libraries in directory `native-libs`
	// Used by the actions runner for releases
	def targets = [
		"linux-gnu-x86_64",
		"linux-gnu-arm64"
	];

	for(def target in targets) {
		def f = file("native-libs/libwaylandcraft-${target}.so")
		if(!f.exists()) continue;

		with(copySpec {
			from(f)
		})
		natives.add("${target}")
	}

	if(natives.size() < 1) {
		services
			.get(StyledTextOutputFactory)
			.create("waylandcraft")
			.withStyle(Style.Failure)
			.println("WARNING: Native library not built! The built mod will not contain native code");
	}
}

loom {
	runs {
		client {
			// need to append, otherwise we get "Driver does not support OpenGL" in Nix containers
			environmentVariable("LD_LIBRARY_PATH",
				["../native/target/debug/", System.getenv("LD_LIBRARY_PATH")]
					.findAll { it }.join(":"))
			environmentVariable("__GL_THREADED_OPTIMIZATIONS", "0")
			environmentVariable("RUST_BACKTRACE", "1")
			programArguments.add("-graphicsBackend=vulkan")
			//programArguments.add("-vulkanValidation")
		}
	}
	accessWidenerPath = file("src/main/resources/waylandcraft.classtweaker")
}

// Publishing to Modrinth. This is only ever driven from CI (see
// .github/workflows/release.yml), triggered by pushing a version tag --
// the jar handed to Minotaur here is the exact same one 'build' just
// produced from this checkout, so what ends up on Modrinth is provably
// built from the tagged source, not something assembled by hand.
//
// MODRINTH_TOKEN and MODRINTH_PROJECT_ID come from the environment (a
// repo secret and a repo variable respectively) so this file never needs
// to contain either. Locally, both are unset, MINOTAUR_TOKEN_MISSING
// stays true, and `./gradlew modrinth` becomes a deliberate no-op
// instead of failing or accidentally publishing.
// Pointing uploadFile at the known output path rather than a Loom task
// reference (e.g. tasks.remapJar/tasks.named("remapJar")) -- this Loom
// version (1.17.17) doesn't register a task under that name at all.
// The file name itself comes from archives_base_name (gradle.properties),
// not a literal "waylandcraft.jar" -- keep it derived so a rename there
// can't silently desync this from the actual build output again.
modrinth {
	token = System.getenv("MODRINTH_TOKEN") ?: "MINOTAUR_TOKEN_MISSING"
	projectId = System.getenv("MODRINTH_PROJECT_ID") ?: "MINOTAUR_PROJECT_ID_MISSING"
	versionNumber = project.version
	versionName = "WaylandCraft++ ${project.version}"
	versionType = System.getenv("MODRINTH_VERSION_TYPE") ?: "release"
	changelog = System.getenv("MODRINTH_CHANGELOG") ?: "See the GitHub release for details."
	uploadFile = file("build/libs/${project.archives_base_name}.jar")
	gameVersions = [project.minecraft_version]
	loaders = ["fabric"]
}

tasks.modrinth.onlyIf {
	def ready = System.getenv("MODRINTH_TOKEN") != null && System.getenv("MODRINTH_PROJECT_ID") != null
	if(!ready) {
		logger.lifecycle("Skipping Modrinth publish: MODRINTH_TOKEN/MODRINTH_PROJECT_ID not set in the environment.")
	}
	ready
}

tasks.modrinth.dependsOn tasks.build

// TEMPORARY diagnostic task for the 26.3 port (see project thread "Port to 26.3").
// Round 2: round 1 found the real com.mojang.renderpearl.* package layout (api/,
// backend/{opengl,vulkan,common,api}/, frontend/, util/) but none of our guessed
// subpackages (pipeline/, textures/, buffers/, systems/, opengl/, vulkan/, vertex/,
// platform/) existed under it, and several classes (PoseStack, BufferBuilder,
// TextureTarget, RenderSystem, Window, NativeImage, Std140Builder, ...) weren't
// under renderpearl at all. This round lists whatever's left under com.mojang.blaze3d
// and locates those classes anywhere on the classpath by simple name, then runs javap
// on both the confirmed renderpearl classes and whatever it finds for the rest.
// Remove this task (and the build.yml step pointing at it) once the port is done.
tasks.register("diagPort263") {
	doLast {
		def cp = sourceSets.main.compileClasspath.files

		def knownCandidates = [
			"com/mojang/renderpearl/api/GpuFormat.class",
			"com/mojang/renderpearl/api/pipeline/PrimitiveTopology.class",
			"com/mojang/renderpearl/api/pipeline/IndexType.class",
			"com/mojang/renderpearl/api/pipeline/RenderPipeline.class",
			"com/mojang/renderpearl/api/pipeline/BindGroupLayout.class",
			"com/mojang/renderpearl/api/pipeline/ColorTargetState.class",
			"com/mojang/renderpearl/api/pipeline/DepthStencilState.class",
			"com/mojang/renderpearl/api/pipeline/BlendFunction.class",
			"com/mojang/renderpearl/api/pipeline/BlendFactor.class",
			"com/mojang/renderpearl/api/pipeline/BlendEquation.class",
			"com/mojang/renderpearl/api/pipeline/BlendOp.class",
			"com/mojang/renderpearl/api/pipeline/CompareOp.class",
			"com/mojang/renderpearl/api/pipeline/PolygonMode.class",
			"com/mojang/renderpearl/api/pipeline/UniformType.class",
			"com/mojang/renderpearl/api/pipeline/ShaderType.class",
			"com/mojang/renderpearl/api/pipeline/ShaderSource.class",
			"com/mojang/renderpearl/api/pipeline/CompiledRenderPipeline.class",
			"com/mojang/renderpearl/api/buffers/GpuBuffer.class",
			"com/mojang/renderpearl/api/buffers/GpuBufferSlice.class",
			"com/mojang/renderpearl/api/buffers/TransientMemory.class",
			"com/mojang/renderpearl/api/textures/GpuTexture.class",
			"com/mojang/renderpearl/api/textures/GpuTextureView.class",
			"com/mojang/renderpearl/api/textures/GpuSampler.class",
			"com/mojang/renderpearl/api/textures/FilterMode.class",
			"com/mojang/renderpearl/api/textures/AddressMode.class",
			"com/mojang/renderpearl/api/device/GpuDevice.class",
			"com/mojang/renderpearl/api/device/GpuSurface.class",
			"com/mojang/renderpearl/api/device/DeviceFeatures.class",
			"com/mojang/renderpearl/api/commands/CommandEncoder.class",
			"com/mojang/renderpearl/api/commands/RenderPass.class",
			"com/mojang/renderpearl/api/commands/RenderPassDescriptor.class",
			"com/mojang/renderpearl/api/vertex/VertexFormat.class",
			"com/mojang/renderpearl/api/vertex/VertexFormatElement.class",
			"com/mojang/renderpearl/backend/api/GpuDeviceBackend.class",
			"com/mojang/renderpearl/backend/api/CommandEncoderBackend.class",
			"com/mojang/renderpearl/backend/api/BackendRenderPipeline.class",
			"com/mojang/renderpearl/backend/api/RenderPassBackend.class",
			"com/mojang/renderpearl/backend/opengl/GlDevice.class",
			"com/mojang/renderpearl/backend/opengl/GlTexture.class",
			"com/mojang/renderpearl/backend/opengl/GlStateManager.class",
			"com/mojang/renderpearl/backend/opengl/FrameBufferCache.class",
			"com/mojang/renderpearl/backend/opengl/GlCommandEncoder.class",
			"com/mojang/renderpearl/backend/opengl/GlRenderPass.class",
			"com/mojang/renderpearl/backend/vulkan/VulkanDevice.class",
			"com/mojang/renderpearl/backend/vulkan/VulkanGpuBuffer.class",
			"com/mojang/renderpearl/backend/vulkan/VulkanGpuTexture.class",
			"com/mojang/renderpearl/backend/vulkan/VulkanCommandEncoder.class",
			"com/mojang/renderpearl/backend/vulkan/VulkanRenderPass.class",
			"com/mojang/renderpearl/backend/common/BaseGpuTexture.class",
			"com/mojang/renderpearl/backend/common/BaseGpuBuffer.class",
			"com/mojang/renderpearl/backend/common/BaseGpuTextureView.class",
			"com/mojang/renderpearl/frontend/FrontendGpuDevice.class",
			"com/mojang/renderpearl/frontend/FrontendCommandEncoder.class",
			"com/mojang/renderpearl/frontend/FrontendRenderPass.class",
			"com/mojang/renderpearl/frontend/FrontendRenderPipeline.class",
			"net/minecraft/client/renderer/DynamicGpuDataStorage.class",
			"net/minecraft/client/renderer/DynamicGpuDataStorageMapped.class",
			"net/minecraft/client/renderer/DynamicGpuDataStorageNonMapped.class",
			"net/minecraft/client/renderer/UniformValue.class",
			"net/minecraft/client/renderer/DynamicGpuData.class",
			"net/minecraft/client/renderer/GlobalSettingsUniform.class",
		] as Set

		// Classes round 1 didn't find under renderpearl -- locate by simple name, wherever they are.
		def searchNames = [
			"PoseStack.class", "BufferBuilder.class", "ByteBufferBuilder.class", "MeshData.class",
			"DefaultVertexFormat.class", "VertexConsumer.class", "TextureTarget.class", "RenderTarget.class",
			"Window.class", "InputConstants.class", "NativeImage.class", "RenderSystem.class",
			"Std140Builder.class", "Std140SizeCalculator.class", "AutoStorageIndexBuffer.class",
		] as Set

		def tmpDir = new File(project.layout.buildDirectory.get().asFile, "diag-extract2")
		tmpDir.deleteDir()
		tmpDir.mkdirs()

		def blaze3dClasses = new TreeSet<String>()
		def foundIn = [:]
		def foundByName = [:]

		cp.each { f ->
			if(!f.exists() || !f.name.endsWith(".jar")) return
			try {
				def zip = new java.util.zip.ZipFile(f)
				try {
					zip.entries().each { entry ->
						def name = entry.name
						if(!name.endsWith(".class")) return
						if(name.startsWith("com/mojang/blaze3d/") && !name.contains('$')) {
							blaze3dClasses.add(name)
						}
						if(knownCandidates.contains(name) && !foundIn.containsKey(name)) {
							foundIn[name] = f
						}
						def simple = name.substring(name.lastIndexOf('/') + 1)
						if(searchNames.contains(simple)) {
							foundByName.computeIfAbsent(simple, { new TreeSet<String>() }).add(name)
							if(!foundIn.containsKey(name)) foundIn[name] = f
						}
					}
				} finally {
					zip.close()
				}
			} catch(Exception e) {
				println "DIAG2:ZIP_ERROR:${f}:${e}"
			}
		}

		println "DIAG2_BEGIN"
		println "DIAG2:BLAZE3D_REMAINING_COUNT=${blaze3dClasses.size()}"
		blaze3dClasses.each { println "DIAG2:BLAZE3D_CLASS:${it}" }
		foundByName.each { simple, paths ->
			paths.each { p -> println "DIAG2:FOUND_BY_NAME:${simple}::${p}" }
		}
		searchNames.each { simple ->
			if(!foundByName.containsKey(simple)) println "DIAG2:NOT_FOUND_BY_NAME:${simple}"
		}

		foundIn.each { name, jarFile ->
			try {
				def zip = new java.util.zip.ZipFile(jarFile)
				try {
					def entry = zip.getEntry(name)
					def classDir = new File(tmpDir, "cp_" + Integer.toHexString(name.hashCode()))
					def destFile = new File(classDir, name)
					destFile.parentFile.mkdirs()
					destFile.bytes = zip.getInputStream(entry).bytes

					def binaryName = name.replace('/', '.').replace('.class', '')
					def proc = ["javap", "-p", "-classpath", classDir.absolutePath, binaryName].execute()
					proc.waitFor()
					println "DIAG2_JAVAP_BEGIN:${name}"
					proc.in.eachLine { line -> println "DIAG2:JAVAP:${name}::${line}" }
					proc.err.eachLine { line -> println "DIAG2:JAVAP_ERR:${name}::${line}" }
					println "DIAG2_JAVAP_END:${name}"
				} finally {
					zip.close()
				}
			} catch(Exception e) {
				println "DIAG2:JAVAP_EXCEPTION:${name}:${e}"
			}
		}

		println "DIAG2_END"
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
