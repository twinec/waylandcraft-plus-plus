plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.modrinth.minotaur' version '2.+'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}

	// Polymer's own repo -- publishes each submodule (e.g. polymer-core)
	// unbundled. Modrinth's maven only exposes the combined jar-in-jar
	// "polymer-bundled" artifact, whose classes aren't visible at compile
	// time since Fabric Loader only unpacks jar-in-jar contents at runtime.
	exclusiveContent {
		forRepository {
			maven {
				name = "Nucleoid"
				url = "https://maven.nucleoid.xyz/"
			}
		}
		filter {
			includeGroup "eu.pb4"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	compileOnly "maven.modrinth:iris:${project.iris_version}"
	compileOnly "eu.pb4:polymer-core:${project.polymer_version}"
	compileOnly "eu.pb4:polymer-resource-pack:${project.polymer_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

import org.gradle.internal.logging.text.StyledTextOutputFactory;
import static org.gradle.internal.logging.text.StyledTextOutput.Style;

jar {
	inputs.property "archivesName", project.base.archivesName
	version = null

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}

	// Human readable list of compiled native libraries that were found
	def natives = []

	// Host-specific native library
	def nativeFile = file("native/target/debug/libwaylandcraft.so")
	if(nativeFile.exists()) {
		from(nativeFile)
		natives.add("host")
	}

	// Packaging of libraries in directory `native-libs`
	// Used by the actions runner for releases
	def targets = [
		"linux-gnu-x86_64",
		"linux-gnu-arm64"
	];

	for(def target in targets) {
		def f = file("native-libs/libwaylandcraft-${target}.so")
		if(!f.exists()) continue;

		with(copySpec {
			from(f)
		})
		natives.add("${target}")
	}

	if(natives.size() < 1) {
		services
			.get(StyledTextOutputFactory)
			.create("waylandcraft")
			.withStyle(Style.Failure)
			.println("WARNING: Native library not built! The built mod will not contain native code");
	}
}

loom {
	runs {
		client {
			environmentVariable("LD_LIBRARY_PATH", "../native/target/debug/")
			environmentVariable("__GL_THREADED_OPTIMIZATIONS", "0")
			environmentVariable("RUST_BACKTRACE", "1")
		}
	}
}

// Publishing to Modrinth. This is only ever driven from CI (see
// .github/workflows/release.yml), triggered by pushing a version tag --
// the jar handed to Minotaur here is the exact same one 'build' just
// produced from this checkout, so what ends up on Modrinth is provably
// built from the tagged source, not something assembled by hand.
//
// MODRINTH_TOKEN and MODRINTH_PROJECT_ID come from the environment (a
// repo secret and a repo variable respectively) so this file never needs
// to contain either. Locally, both are unset, MINOTAUR_TOKEN_MISSING
// stays true, and `./gradlew modrinth` becomes a deliberate no-op
// instead of failing or accidentally publishing.
// Pointing uploadFile at the known output path rather than a Loom task
// reference (e.g. tasks.remapJar/tasks.named("remapJar")) -- this Loom
// version (1.17.17) doesn't register a task under that name at all, and
// the jar{} block above and every workflow in .github/workflows already
// agree the final jar lands at build/libs/waylandcraft.jar, so there's
// no need to guess Loom's internal task naming for this version.
modrinth {
	token = System.getenv("MODRINTH_TOKEN") ?: "MINOTAUR_TOKEN_MISSING"
	projectId = System.getenv("MODRINTH_PROJECT_ID") ?: "MINOTAUR_PROJECT_ID_MISSING"
	versionNumber = project.version
	versionName = "WaylandCraft++ ${project.version}"
	versionType = System.getenv("MODRINTH_VERSION_TYPE") ?: "release"
	changelog = System.getenv("MODRINTH_CHANGELOG") ?: "See the GitHub release for details."
	uploadFile = file("build/libs/waylandcraft.jar")
	gameVersions = [project.minecraft_version]
	loaders = ["fabric"]
}

tasks.modrinth.onlyIf {
	def ready = System.getenv("MODRINTH_TOKEN") != null && System.getenv("MODRINTH_PROJECT_ID") != null
	if(!ready) {
		logger.lifecycle("Skipping Modrinth publish: MODRINTH_TOKEN/MODRINTH_PROJECT_ID not set in the environment.")
	}
	ready
}

tasks.modrinth.dependsOn tasks.build

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
