plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.modrinth.minotaur' version '2.+'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}

	// Polymer's own repo -- publishes each submodule (e.g. polymer-core)
	// unbundled. Modrinth's maven only exposes the combined jar-in-jar
	// "polymer-bundled" artifact, whose classes aren't visible at compile
	// time since Fabric Loader only unpacks jar-in-jar contents at runtime.
	exclusiveContent {
		forRepository {
			maven {
				name = "Nucleoid"
				url = "https://maven.nucleoid.xyz/"
			}
		}
		filter {
			includeGroup "eu.pb4"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	compileOnly "maven.modrinth:iris:${project.iris_version}"

	// Window sharing: pure-Java H.264 (JCodec) and Opus (Concentus), bundled in the jar
	// so every client can decode shared windows
	implementation include("org.jcodec:jcodec:${project.jcodec_version}")
	implementation include("io.github.jaredmdobson:concentus:${project.concentus_version}")
	compileOnly "eu.pb4:polymer-core:${project.polymer_version}"
	compileOnly "eu.pb4:polymer-resource-pack:${project.polymer_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

import org.gradle.internal.logging.text.StyledTextOutputFactory;
import static org.gradle.internal.logging.text.StyledTextOutput.Style;

jar {
	inputs.property "archivesName", project.base.archivesName
	version = null

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}

	// Human readable list of compiled native libraries that were found
	def natives = []

	// Host-specific native library
	def nativeFile = file("native/target/debug/libwaylandcraft.so")
	if(nativeFile.exists()) {
		from(nativeFile)
		natives.add("host")
	}

	// Packaging of libraries in directory `native-libs`
	// Used by the actions runner for releases
	def targets = [
		"linux-gnu-x86_64",
		"linux-gnu-arm64"
	];

	for(def target in targets) {
		def f = file("native-libs/libwaylandcraft-${target}.so")
		if(!f.exists()) continue;

		with(copySpec {
			from(f)
		})
		natives.add("${target}")
	}

	if(natives.size() < 1) {
		services
			.get(StyledTextOutputFactory)
			.create("waylandcraft")
			.withStyle(Style.Failure)
			.println("WARNING: Native library not built! The built mod will not contain native code");
	}
}

loom {
	runs {
		client {
			// need to append, otherwise we get "Driver does not support OpenGL" in Nix containers
			environmentVariable("LD_LIBRARY_PATH",
				["../native/target/debug/", System.getenv("LD_LIBRARY_PATH")]
					.findAll { it }.join(":"))
			environmentVariable("__GL_THREADED_OPTIMIZATIONS", "0")
			environmentVariable("RUST_BACKTRACE", "1")
			programArguments.add("-graphicsBackend=vulkan")
			//programArguments.add("-vulkanValidation")
		}
	}
	accessWidenerPath = file("src/main/resources/waylandcraft.classtweaker")
}

// Publishing to Modrinth. This is only ever driven from CI (see
// .github/workflows/release.yml), triggered by pushing a version tag --
// the jar handed to Minotaur here is the exact same one 'build' just
// produced from this checkout, so what ends up on Modrinth is provably
// built from the tagged source, not something assembled by hand.
//
// MODRINTH_TOKEN and MODRINTH_PROJECT_ID come from the environment (a
// repo secret and a repo variable respectively) so this file never needs
// to contain either. Locally, both are unset, MINOTAUR_TOKEN_MISSING
// stays true, and `./gradlew modrinth` becomes a deliberate no-op
// instead of failing or accidentally publishing.
// Pointing uploadFile at the known output path rather than a Loom task
// reference (e.g. tasks.remapJar/tasks.named("remapJar")) -- this Loom
// version (1.17.17) doesn't register a task under that name at all.
// The file name itself comes from archives_base_name (gradle.properties),
// not a literal "waylandcraft.jar" -- keep it derived so a rename there
// can't silently desync this from the actual build output again.
modrinth {
	token = System.getenv("MODRINTH_TOKEN") ?: "MINOTAUR_TOKEN_MISSING"
	projectId = System.getenv("MODRINTH_PROJECT_ID") ?: "MINOTAUR_PROJECT_ID_MISSING"
	versionNumber = project.version
	versionName = "WaylandCraft++ ${project.version}"
	versionType = System.getenv("MODRINTH_VERSION_TYPE") ?: "release"
	changelog = System.getenv("MODRINTH_CHANGELOG") ?: "See the GitHub release for details."
	uploadFile = file("build/libs/${project.archives_base_name}.jar")
	gameVersions = [project.minecraft_version]
	loaders = ["fabric"]
}

tasks.modrinth.onlyIf {
	def ready = System.getenv("MODRINTH_TOKEN") != null && System.getenv("MODRINTH_PROJECT_ID") != null
	if(!ready) {
		logger.lifecycle("Skipping Modrinth publish: MODRINTH_TOKEN/MODRINTH_PROJECT_ID not set in the environment.")
	}
	ready
}

tasks.modrinth.dependsOn tasks.build

// TEMPORARY diagnostic task for the 26.3 port (see project thread "Port to 26.3").
// Lists the real com.mojang.renderpearl.* / SDL / DynamicGpuDataStorage class layout
// from the resolved 26.3 dependency jars, and runs javap on a curated set of classes
// we expect to need, so the port can be written against real signatures instead of
// guesses. Remove this task (and the build.yml step pointing at it) once the port is done.
tasks.register("diagPort263") {
	doLast {
		def cp = sourceSets.main.compileClasspath.files

		def javapCandidates = [
			"com/mojang/renderpearl/pipeline/RenderPipeline.class",
			"com/mojang/renderpearl/pipeline/BindGroupLayout.class",
			"com/mojang/renderpearl/pipeline/ColorTargetState.class",
			"com/mojang/renderpearl/pipeline/DepthStencilState.class",
			"com/mojang/renderpearl/pipeline/BlendFunction.class",
			"com/mojang/renderpearl/pipeline/TextureTarget.class",
			"com/mojang/renderpearl/pipeline/RenderTarget.class",
			"com/mojang/renderpearl/textures/GpuTexture.class",
			"com/mojang/renderpearl/textures/GpuTextureView.class",
			"com/mojang/renderpearl/textures/GpuSampler.class",
			"com/mojang/renderpearl/textures/FilterMode.class",
			"com/mojang/renderpearl/textures/AddressMode.class",
			"com/mojang/renderpearl/buffers/GpuBuffer.class",
			"com/mojang/renderpearl/buffers/GpuBufferSlice.class",
			"com/mojang/renderpearl/buffers/Std140Builder.class",
			"com/mojang/renderpearl/buffers/Std140SizeCalculator.class",
			"com/mojang/renderpearl/shaders/UniformType.class",
			"com/mojang/renderpearl/systems/GpuDevice.class",
			"com/mojang/renderpearl/systems/GpuDeviceBackend.class",
			"com/mojang/renderpearl/systems/RenderPass.class",
			"com/mojang/renderpearl/systems/RenderSystem.class",
			"com/mojang/renderpearl/systems/CommandEncoder.class",
			"com/mojang/renderpearl/opengl/GlDevice.class",
			"com/mojang/renderpearl/opengl/GlTexture.class",
			"com/mojang/renderpearl/opengl/GlStateManager.class",
			"com/mojang/renderpearl/opengl/FrameBufferCache.class",
			"com/mojang/renderpearl/vulkan/VulkanDevice.class",
			"com/mojang/renderpearl/vulkan/VulkanGpuBuffer.class",
			"com/mojang/renderpearl/vulkan/VulkanGpuTexture.class",
			"com/mojang/renderpearl/vulkan/VulkanCommandEncoder.class",
			"com/mojang/renderpearl/vertex/PoseStack.class",
			"com/mojang/renderpearl/vertex/BufferBuilder.class",
			"com/mojang/renderpearl/vertex/ByteBufferBuilder.class",
			"com/mojang/renderpearl/vertex/MeshData.class",
			"com/mojang/renderpearl/vertex/DefaultVertexFormat.class",
			"com/mojang/renderpearl/platform/Window.class",
			"com/mojang/renderpearl/platform/InputConstants.class",
			"com/mojang/renderpearl/platform/NativeImage.class",
			"com/mojang/renderpearl/GpuFormat.class",
			"com/mojang/renderpearl/PrimitiveTopology.class",
			"com/mojang/renderpearl/IndexType.class",
			"net/minecraft/client/renderer/DynamicGpuDataStorage.class",
			"net/minecraft/client/renderer/DynamicGpuDataStorageMapped.class",
			"net/minecraft/client/renderer/DynamicGpuDataStorageNonMapped.class",
			"net/minecraft/client/renderer/UniformValue.class",
		] as Set

		def tmpDir = new File(project.layout.buildDirectory.get().asFile, "diag-extract")
		tmpDir.deleteDir()
		tmpDir.mkdirs()

		def renderpearlClasses = new TreeSet<String>()
		def sdlEntries = new TreeSet<String>()
		def glfwEntries = new TreeSet<String>()
		def uniformEntries = new TreeSet<String>()
		def foundIn = [:]

		cp.each { f ->
			if(!f.exists() || !f.name.endsWith(".jar")) return
			try {
				def zip = new java.util.zip.ZipFile(f)
				try {
					zip.entries().each { entry ->
						def name = entry.name
						if(name.startsWith("com/mojang/renderpearl/") && name.endsWith(".class") && !name.contains('$')) {
							renderpearlClasses.add(name)
						}
						if(name.startsWith("org/lwjgl/") && name.toLowerCase().contains("sdl") && name.endsWith(".class")) {
							sdlEntries.add(name)
						}
						if(name.startsWith("org/lwjgl/glfw/") && name.endsWith(".class")) {
							glfwEntries.add(name)
						}
						if(name.startsWith("net/minecraft/client/renderer/") && (name.contains("Uniform") || name.contains("DynamicGpuData")) && name.endsWith(".class")) {
							uniformEntries.add(name)
						}
						if(javapCandidates.contains(name) && !foundIn.containsKey(name)) {
							foundIn[name] = f
						}
					}
				} finally {
					zip.close()
				}
			} catch(Exception e) {
				println "DIAG:ZIP_ERROR:${f}:${e}"
			}
		}

		println "DIAG_BEGIN"
		println "DIAG:RENDERPEARL_CLASS_COUNT=${renderpearlClasses.size()}"
		renderpearlClasses.each { println "DIAG:RP_CLASS:${it}" }
		println "DIAG:SDL_COUNT=${sdlEntries.size()}"
		sdlEntries.each { println "DIAG:SDL_CLASS:${it}" }
		println "DIAG:GLFW_COUNT=${glfwEntries.size()}"
		glfwEntries.each { println "DIAG:GLFW_CLASS:${it}" }
		println "DIAG:UNIFORM_COUNT=${uniformEntries.size()}"
		uniformEntries.each { println "DIAG:UNIFORM_CLASS:${it}" }

		foundIn.each { name, jarFile ->
			try {
				def zip = new java.util.zip.ZipFile(jarFile)
				try {
					def entry = zip.getEntry(name)
					def classDir = new File(tmpDir, "cp_" + Integer.toHexString(name.hashCode()))
					def destFile = new File(classDir, name)
					destFile.parentFile.mkdirs()
					destFile.bytes = zip.getInputStream(entry).bytes

					def binaryName = name.replace('/', '.').replace('.class', '')
					def proc = ["javap", "-p", "-classpath", classDir.absolutePath, binaryName].execute()
					proc.waitFor()
					println "DIAG_JAVAP_BEGIN:${name}"
					proc.in.eachLine { line -> println "DIAG:JAVAP:${name}::${line}" }
					proc.err.eachLine { line -> println "DIAG:JAVAP_ERR:${name}::${line}" }
					println "DIAG_JAVAP_END:${name}"
				} finally {
					zip.close()
				}
			} catch(Exception e) {
				println "DIAG:JAVAP_EXCEPTION:${name}:${e}"
			}
		}

		def missing = javapCandidates - foundIn.keySet()
		missing.each { println "DIAG:NOT_FOUND:${it}" }

		println "DIAG_END"
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
