# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod Properties
# Kept identical in form to the 26.2 line's mod_version (e.g. "3.2.0", no
# "+26.3" suffix) so Mod Menu and friends display a plain version number.
# The 26.3 line's release tags stay distinct from 26.2's via release.yml's
# tag_suffix input instead -- see project memory.
mod_version=3.2.1
maven_group=dev.twinec.waylandcraft_plus_plus
archives_base_name=waylandcraft_plus_plus

# Dependencies
# fabric_version/polymer_version confirmed against Polymer's own dev/26.3
# branch source (fabric_api_version 0.160.5+26.3, mod_version 0.18.2).
# Iris 26.3 (version 1.11.6+mc26.3, confirmed via Artemis's real jar/source
# dump) isn't published on Modrinth's maven yet, so it's vendored directly
# as libs/iris-fabric-1.11.6+mc26.3.jar instead of a maven.modrinth coordinate
# -- swap back to a Modrinth dependency once it's actually released there.
fabric_version=0.160.5+26.3
jcodec_version=0.2.5
concentus_version=1.0.2
polymer_version=0.18.2+26.3
