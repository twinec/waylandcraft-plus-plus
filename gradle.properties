# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.17.+

# Mod Properties
# Distinct from the 26.2 line's mod_version (currently 3.1.1) so the
# release workflow's `git tag v${mod_version}` doesn't collide when both
# game-version builds are released in parallel -- see release.yml.
mod_version=3.1.1+26.3
maven_group=dev.twinec.waylandcraft_plus_plus
archives_base_name=waylandcraft_plus_plus

# Dependencies
fabric_version=0.160.7+26.3
iris_version=1.11.6+26.3-fabric
# eu.pb4/polymer-core's 26.3 release, per Patbox/polymer's GitHub releases
# (0.18.1+26.3). Not re-confirmed against the bundled Modrinth jar the way
# the 26.2 pin was -- worth double-checking if compileOnly resolution fails.
polymer_version=0.18.1+26.3
