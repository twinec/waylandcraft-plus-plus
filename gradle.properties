# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod Properties
# Distinct from the 26.2 line's mod_version so the release workflow's
# `git tag v${mod_version}` doesn't collide when both lines are released
# in parallel -- see release.yml/settings discussion in project memory.
mod_version=3.2.0+26.3
maven_group=dev.twinec.waylandcraft_plus_plus
archives_base_name=waylandcraft_plus_plus

# Dependencies
# Not yet independently confirmed against a real downloaded 26.3 jar
# the way the 26.2 pins were -- these are best-guess based on the 26.2
# versions' own +26.3 releases; verify via a real CI compile.
fabric_version=0.160.7+26.3
jcodec_version=0.2.5
concentus_version=1.0.2
iris_version=1.11.6+26.3-fabric
polymer_version=0.18.1+26.3
